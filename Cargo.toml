[package]
name = "watermarker"
version = "1.0.0"
edition = "2021"
description = "Visible + invisible watermarking for PNG/JPEG, single static Linux binary"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
